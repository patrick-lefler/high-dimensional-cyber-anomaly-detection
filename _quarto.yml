project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - dependency-graph.qmd
    - detector.qmd
    - thresholds.qmd
    - evaluation.qmd
    - reproducibility.qmd
    - license.qmd

website:
  title: "Cyber Anomaly Detection & Dependency Risk"
  search: false
  page-navigation: true
  sidebar:
    style: floating
    contents:
      - href: index.qmd
        text: Overview
      - href: dependency-graph.qmd
        text: Dependency Graph
      - href: detector.qmd
        text: Detector
      - href: thresholds.qmd
        text: Thresholds
      - href: evaluation.qmd
        text: Evaluation
      - href: reproducibility.qmd
        text: Reproducibility
  page-footer:
    center: "© 2026 Patrick Lefler ⦁ [MIT License](license.qmd) ⦁ Built with R & Quarto"

format:
  html:
    theme: [sandstone, theme.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "Contents"
    code-fold: true
    code-copy: true
    code-overflow: wrap
    code-tools: true
    code-summary: "Display code"
    df-print: kable
    fig-align: center
    fig-height: 6
    fig-width: 10
    highlight-style: arrow
    lightbox: true
    linkcolor: "#0166CC"
    number-sections: false
    page-layout: full
    smooth-scroll: true
    html-math-method: mathjax

execute:
  echo: true
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: "#>"
